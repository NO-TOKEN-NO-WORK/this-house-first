name: 기능 작업
description: PRD 요구사항 구현 작업
labels: ["feature"]
body:
  - type: input
    id: requirement
    attributes:
      label: PRD 요구사항 ID
      description: 예: FR-4, F3, §9
      placeholder: FR-4
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 무엇을 만들면 완료인가 (완료 조건 포함)
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - Must
        - Should
        - Could
    validations:
      required: true

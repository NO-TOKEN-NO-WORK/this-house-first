name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # postinstall에서 prisma generate가 실행된다
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # 빌드는 DB에 접속하지 않는다. Prisma 클라이언트 초기화에 값만 필요하다
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
